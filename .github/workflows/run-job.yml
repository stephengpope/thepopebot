name: Run CrucibleBot Job (self-hosted)

on:
  create:

jobs:
  run-agent:
    runs-on: [self-hosted, windows]
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'job/')
    permissions:
      contents: write
      pull-requests: write
      packages: read

    steps:
      - name: Validate required configuration
        shell: powershell
        env:
          IMAGE_URL: ${{ vars.IMAGE_URL }}
          SECRETS: ${{ secrets.SECRETS }}
        run: |
          if (-not $env:IMAGE_URL) { throw "Missing repo variable: IMAGE_URL (example: ghcr.io/dtc2002/cruciblebot)" }
          if (-not $env:SECRETS) { throw "Missing repo secret: SECRETS (base64 JSON must include GH_TOKEN)" }
          Write-Host "IMAGE_URL present."
          Write-Host "SECRETS present (length=$($env:SECRETS.Length))."

      - name: Login to GHCR (if needed)
        # Only required for private GHCR images or rate-limit avoidance.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CrucibleBot Agent container
        shell: powershell
        env:
          IMAGE_URL: ${{ vars.IMAGE_URL }}
          MODEL: ${{ vars.MODEL }}
          SECRETS: ${{ secrets.SECRETS }}
          LLM_SECRETS: ${{ secrets.LLM_SECRETS }}
        run: |
          $image = "$($env:IMAGE_URL):latest"
          Write-Host "Using image: $image"

          if (-not $env:MODEL) { $env:MODEL = "qwen2.5-coder:14b" }

          docker run --rm `
            -e REPO_URL="${{ github.server_url }}/${{ github.repository }}.git" `
            -e BRANCH="${{ github.ref_name }}" `
            -e SECRETS="$env:SECRETS" `
            -e LLM_SECRETS="$env:LLM_SECRETS" `
            -e PROVIDER="ollama" `
            -e MODEL="$env:MODEL" `
            -e OPENAI_BASE_URL="http://host.docker.internal:11434/v1" `
            -e OPENAI_API_KEY="ollama" `
            $image
