name: Run CrucibleBot Job (local win10)

on:
  create:

jobs:
  run-agent:
    runs-on: [self-hosted, windows]
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'job/')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout job branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Show context
        shell: pwsh
        run: |
          Write-Host "Repo: $env:GITHUB_REPOSITORY"
          Write-Host "Ref name: $env:GITHUB_REF_NAME"
          git status

      # PROVE the runner can execute and push back to the job branch.
      - name: Apply job (smoke test)
        shell: pwsh
        run: |
          Set-Content -Path test.txt -Value "hello"
          git add -A
          git commit -m "cruciblebot: apply job $env:GITHUB_REF_NAME" || Write-Host "Nothing to commit"
          git push origin HEAD
